# Recommended modelRoles for the quality/cost routing policy.
# Copy entries into ~/.omp/agent/config.yml (or project .omp/config.yml).
# Do not treat this file as a machine-wide default — it is documentation only.
#
# Comma lists are ordered attempt chains: credential/auth/credits failures move
# to the next selector via model-resolver + retry.fallbackChains derivation.
# Thinking suffixes use existing modelRoles selectors (`:medium`, `:high`, …).
#
# Top-model roles (orchestration / plan / review / verify) use gpt-6-astra at
# medium effort. Execution (`task`) uses grok-4.6. Scout/search/commit use
# deepseek-v4.1-flash via @smol. Verification never runs on the cheap tier.
#
# paired_evidence_ready=false — these are recommended examples, not measured
# live wins. See docs/design/2026-10-11-omp-quality-cost-plan.md.

modelRoles:
  default: gateway/gpt-6-astra:medium, openai-codex/gpt-5.6-sol
  slow: gateway/gpt-6-astra:medium, openai-codex/gpt-5.6-sol
  plan: gateway/gpt-6-astra:medium, openai-codex/gpt-5.6-sol
  task: gateway/grok-4.6:high, gateway/grok-4.5:high
  smol: gateway/deepseek-v4.1-flash:high, gateway/deepseek-v4-flash:max
  commit: gateway/deepseek-v4.1-flash:high, gateway/deepseek-v4-flash:max
  advisor: gateway/grok-4.6:high, gateway/deepseek-v4.1-flash:high

# Optional explicit runtime chains (override derived tails from modelRoles commas):
# retry:
#   fallbackChains:
#     default: ["openai-codex/gpt-5.6-sol"]
#     task: ["gateway/grok-4.5:high"]

